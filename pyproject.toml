[build-system]
requires = ["setuptools>=83.0.0", "wheel>=0.46.2"]
build-backend = "setuptools.build_meta"

[project]
name = "bluedesk"
version = "0.1.0"
description = "BlueDesk — cross-platform Bluetooth device manager and control console for Windows and macOS"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "BlueDesk Contributors" }]
dependencies = [
  "PySide6>=6.10.3,<7",
  "bleak>=1.1.1,<4",
  "pyobjc-framework-IOBluetooth>=12.0,<13; sys_platform == 'darwin'",
]

[project.optional-dependencies]
windows = ["pycaw>=20240210", "comtypes>=1.2"]
dev = ["pytest>=9.0.3,<10", "pytest-asyncio>=1.2,<2", "Pillow>=12.3.0,<13", "pip-audit>=2.10", "pip>=26.2", "setuptools>=83.0.0"]

[project.scripts]
bluedesk = "bluedesk.app:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
