name: Tests and dependency security

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
        python: ['3.12', '3.14']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install, test, and audit an isolated environment
        shell: bash
        run: |
          python -m venv .ci-venv
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            source .ci-venv/Scripts/activate
          else
            source .ci-venv/bin/activate
          fi
          python -m pip install --upgrade "pip>=26.2" "setuptools>=83.0.0" "wheel>=0.46.2"
          python -m pip install -e ".[dev]"
          python -m pip check
          python -m pytest -q
          python -m pip_audit --skip-editable
